<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E6B58"><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Minha Rotina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column for the phone. Big day header, progress count with a bar,
   a 7-day strip with completion rings, then one card per category with tappable rows. */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --ink: #14201C;
  --muted: #5E6E68;
  --line: #DCE4E0;
  --track: #D5DFDA;
  --accent: #0E6B58;
  --accent-ink: #FFFFFF;
  --on-cat: #FFFFFF;
  --danger: #B3321F;
  --c-treino: #C4533A;
  --c-leitura: #3B62B5;
  --c-dieta: #4A8530;
  --c-organizacao: #8654B3;
  --c-outros: #6B7A74;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1311;
    --surface: #151F1C;
    --ink: #E7EFEB;
    --muted: #8FA19A;
    --line: #243430;
    --track: #26362F;
    --accent: #46C3A5;
    --accent-ink: #06211B;
    --on-cat: #0C1311;
    --danger: #FF8A78;
    --c-treino: #F0876C;
    --c-leitura: #8DA9F0;
    --c-dieta: #9AD07A;
    --c-organizacao: #C29AEA;
    --c-outros: #98A8A1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1311;
  --surface: #151F1C;
  --ink: #E7EFEB;
  --muted: #8FA19A;
  --line: #243430;
  --track: #26362F;
  --accent: #46C3A5;
  --accent-ink: #06211B;
  --on-cat: #0C1311;
  --danger: #FF8A78;
  --c-treino: #F0876C;
  --c-leitura: #8DA9F0;
  --c-dieta: #9AD07A;
  --c-organizacao: #C29AEA;
  --c-outros: #98A8A1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.date { min-width: 0; }
.eyebrow { margin: 0 0 4px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--f-display); font-stretch: 120%; font-weight: 800; font-size: clamp(30px, 9vw, 40px); line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
.ghost { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.ghost[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Progress */
.progress { display: flex; align-items: center; gap: 18px; }
.count { flex: none; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.count .of { font-size: 24px; font-weight: 600; color: var(--muted); }
.pbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 0.35s ease; }
.pmsgrow { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.pmsg { margin: 0; font-size: 14px; color: var(--muted); }
.link { background: none; border: 0; padding: 0; min-height: 32px; color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Week strip */
.weekhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.streak { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { --inner: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 8px 0; border: 0; border-radius: 14px; background: none; color: inherit; font-size: 14px; cursor: pointer; }
.day[aria-pressed="true"] { --inner: var(--surface); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.dl { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.day[data-today] .dl { color: var(--accent); font-weight: 500; }
.day[aria-pressed="true"] .dl { color: var(--ink); }
.ring { --p: 0; position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0); }
.ring::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--inner); }
.dn { position: relative; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.day.full .ring::before { background: var(--accent); }
.day.full .dn { color: var(--accent-ink); font-weight: 500; }

/* Add form */
.add { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.add input, .add select { width: 100%; min-width: 0; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 16px; }
.addrow { display: flex; gap: 10px; }
.addrow select { flex: 1; }
.primary { flex: none; min-height: 46px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 600; cursor: pointer; }

/* Groups */
#list { display: flex; flex-direction: column; gap: 14px; }
[data-cat="treino"] { --cat: var(--c-treino); }
[data-cat="leitura"] { --cat: var(--c-leitura); }
[data-cat="dieta"] { --cat: var(--c-dieta); }
[data-cat="organizacao"] { --cat: var(--c-organizacao); }
[data-cat="outros"] { --cat: var(--c-outros); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ghead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cat); }
.gcount { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.check { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 12px 16px; border: 0; background: none; color: inherit; font-size: 16px; text-align: left; cursor: pointer; }
.box { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border: 2px solid var(--cat); border-radius: 8px; color: var(--on-cat); transition: background-color 0.15s ease; }
.box svg { opacity: 0; transform: scale(0.6); transition: opacity 0.15s ease, transform 0.15s ease; }
.check[aria-pressed="true"] .box { background: var(--cat); }
.check[aria-pressed="true"] .box svg { opacity: 1; transform: none; }
.title { min-width: 0; overflow-wrap: anywhere; }
.check[aria-pressed="true"] .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.rm { display: none; flex: none; align-self: center; margin: 8px 12px 8px 0; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--danger); font-size: 14px; font-weight: 600; cursor: pointer; }
body.editing .rm { display: block; }
body.editing .rm.confirm { background: var(--danger); border-color: var(--danger); color: var(--surface); }

.state { margin: 0; padding: 22px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.note { margin: 0; font-size: 13px; color: var(--muted); }

#toast { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#toastMsg { padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  .bar > i, .box, .box svg { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="date">
      <p class="eyebrow" id="weekday"></p>
      <h1 id="dayline"></h1>
    </div>
    <button type="button" id="editBtn" class="ghost" aria-pressed="false">Editar</button>
  </header>

  <section class="progress" aria-live="polite">
    <div class="count"><span id="doneN">–</span><span class="of">/<span id="totalN">–</span></span></div>
    <div class="pbody">
      <div class="bar"><i id="barFill"></i></div>
      <div class="pmsgrow">
        <p class="pmsg" id="pmsg">Carregando…</p>
        <button type="button" id="goToday" class="link" hidden>Voltar para hoje</button>
      </div>
    </div>
  </section>

  <section aria-label="Últimos 7 dias">
    <div class="weekhead">
      <h2>Últimos 7 dias</h2>
      <span class="streak" id="streak"></span>
    </div>
    <div class="days" id="days"></div>
  </section>

  <form id="addForm" class="add" hidden>
    <label class="sr" for="newTitle">Nova tarefa</label>
    <input id="newTitle" type="text" maxlength="80" placeholder="Nova tarefa, por exemplo: Alongar 10 minutos" autocomplete="off" enterkeyhint="done">
    <div class="addrow">
      <label class="sr" for="newCat">Categoria</label>
      <select id="newCat">
        <option value="treino">Treino</option>
        <option value="leitura">Leitura</option>
        <option value="dieta">Dieta</option>
        <option value="organizacao">Organização</option>
        <option value="outros">Outros</option>
      </select>
      <button type="submit" class="primary">Adicionar</button>
    </div>
  </form>

  <main id="list"></main>

  <p class="note" id="note" hidden>Sem conexão com o armazenamento do app. Suas marcações ficam salvas só neste aparelho.</p>
</div>

<div id="toast" role="status" hidden><span id="toastMsg"></span></div>

<script>
(function () {
  "use strict";

  var CATS = [["treino", "Treino"], ["leitura", "Leitura"], ["dieta", "Dieta"], ["organizacao", "Organização"], ["outros", "Outros"]];
  var CAT_OK = {};
  CATS.forEach(function (c) { CAT_OK[c[0]] = true; });
  var DEFAULTS = [
    ["Treino do dia", "treino"],
    ["Alongamento de 10 minutos", "treino"],
    ["Ler 20 minutos", "leitura"],
    ["Café da manhã dentro da dieta", "dieta"],
    ["Almoço dentro da dieta", "dieta"],
    ["Jantar dentro da dieta", "dieta"],
    ["Beber água ao longo do dia", "dieta"],
    ["Organizar o ambiente por 10 minutos", "organizacao"],
    ["Planejar o dia seguinte", "organizacao"]
  ];
  var KEY = "minha-rotina-v1";
  var SVG_CHECK = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function validCat(c) { return CAT_OK[c] ? c : "outros"; }

  var fWeek = new Intl.DateTimeFormat("pt-BR", { weekday: "long" });
  var fDay = new Intl.DateTimeFormat("pt-BR", { day: "numeric", month: "long" });
  var fNarrow = new Intl.DateTimeFormat("pt-BR", { weekday: "narrow" });
  var fFull = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" });

  var state = { tasks: [], days: {}, tasksReady: false, daysReady: false, editing: false, error: false };
  var today = ymd(new Date());
  var selected = today;
  var pendingRemove = null, pendingTimer = null, toastTimer = null;
  var pendingDays = {};
  var backend = null;
  var chain = Promise.resolve();

  function isReady() { return state.tasksReady && state.daysReady; }

  function doneSet(date) {
    var set = {}, ids = state.days[date] || [];
    for (var i = 0; i < ids.length; i++) set[ids[i]] = true;
    return set;
  }
  function stats(date) {
    var ds = doneSet(date), n = 0;
    state.tasks.forEach(function (t) { if (ds[t.id]) n++; });
    return { done: n, total: state.tasks.length };
  }
  function pct(date) {
    var s = stats(date);
    return s.total ? s.done / s.total : 0;
  }
  function streak() {
    var d = parse(today), n = 0;
    if (pct(today) < 1) d.setDate(d.getDate() - 1);
    for (var i = 0; i < 60; i++) {
      if (pct(ymd(d)) >= 1) { n++; d.setDate(d.getDate() - 1); } else break;
    }
    return n;
  }

  function toast(msg) {
    $("toastMsg").textContent = msg;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").hidden = true; }, 3500);
  }
  function enqueue(fn) {
    chain = chain.then(fn).catch(function () {
      toast("Não foi possível salvar. Confira a conexão e tente de novo.");
    });
  }

  /* ---------- Rendering ---------- */

  function renderDays(ready) {
    var box = $("days");
    box.textContent = "";
    var base = parse(today);
    for (var i = 6; i >= 0; i--) {
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - i);
      var key = ymd(d);
      var p = ready ? pct(key) : 0;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "day" + (p >= 1 ? " full" : "");
      b.setAttribute("data-date", key);
      b.setAttribute("data-focus", "d:" + key);
      if (key === today) b.setAttribute("data-today", "");
      b.setAttribute("aria-pressed", key === selected ? "true" : "false");
      b.setAttribute("aria-label", cap(fFull.format(d)) + ", " + Math.round(p * 100) + "% concluído");
      b.innerHTML = '<span class="dl"></span><span class="ring"><span class="dn"></span></span>';
      b.querySelector(".dl").textContent = cap(fNarrow.format(d));
      b.querySelector(".dn").textContent = d.getDate();
      b.querySelector(".ring").style.setProperty("--p", Math.round(p * 100));
      box.appendChild(b);
    }
  }

  function stateP(text) {
    var p = document.createElement("p");
    p.className = "state";
    p.textContent = text;
    return p;
  }

  function renderList(ready) {
    var list = $("list");
    list.textContent = "";
    if (!ready) {
      list.appendChild(stateP(state.error ? "Não foi possível carregar suas tarefas. Feche e abra o app de novo." : "Carregando suas tarefas…"));
      return;
    }
    if (!state.tasks.length) {
      list.appendChild(stateP("Nenhuma tarefa ainda. Toque em Editar e adicione a primeira."));
      return;
    }
    var ds = doneSet(selected);
    CATS.forEach(function (c) {
      var items = state.tasks.filter(function (t) { return t.cat === c[0]; });
      if (!items.length) return;
      var done = items.filter(function (t) { return ds[t.id]; }).length;
      var sec = document.createElement("section");
      sec.className = "group";
      sec.setAttribute("data-cat", c[0]);
      var h = document.createElement("header");
      h.className = "ghead";
      h.innerHTML = '<span class="dot"></span><h2></h2><span class="gcount"></span>';
      h.querySelector("h2").textContent = c[1];
      h.querySelector(".gcount").textContent = done + "/" + items.length;
      var ul = document.createElement("ul");
      ul.className = "rows";
      items.forEach(function (t) {
        var on = !!ds[t.id];
        var li = document.createElement("li");
        li.className = "row";
        var b = document.createElement("button");
        b.type = "button";
        b.className = "check";
        b.setAttribute("data-act", "toggle");
        b.setAttribute("data-id", t.id);
        b.setAttribute("data-focus", "c:" + t.id);
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.innerHTML = '<span class="box">' + SVG_CHECK + '</span><span class="title"></span>';
        b.querySelector(".title").textContent = t.title;
        li.appendChild(b);
        var confirming = pendingRemove === t.id;
        var r = document.createElement("button");
        r.type = "button";
        r.className = "rm" + (confirming ? " confirm" : "");
        r.setAttribute("data-act", "remove");
        r.setAttribute("data-id", t.id);
        r.setAttribute("data-focus", "r:" + t.id);
        r.textContent = confirming ? "Confirmar" : "Remover";
        r.setAttribute("aria-label", (confirming ? "Confirmar remoção de " : "Remover ") + t.title);
        li.appendChild(r);
        ul.appendChild(li);
      });
      sec.appendChild(h);
      sec.appendChild(ul);
      list.appendChild(sec);
    });
  }

  function render() {
    var a = document.activeElement;
    var fid = a && a.getAttribute ? a.getAttribute("data-focus") : null;
    var ready = isReady();
    var sd = parse(selected);
    $("weekday").textContent = cap(fWeek.format(sd)) + (selected === today ? " · hoje" : "");
    $("dayline").textContent = fDay.format(sd);

    var s = stats(selected);
    $("doneN").textContent = ready ? s.done : "–";
    $("totalN").textContent = ready ? s.total : "–";
    $("barFill").style.width = (ready && s.total ? Math.round(s.done / s.total * 100) : 0) + "%";

    var msg, left = s.total - s.done, isToday = selected === today;
    if (!ready) msg = state.error ? "Sem conexão com os dados." : "Carregando…";
    else if (!s.total) msg = "Nenhuma tarefa cadastrada.";
    else if (!left) msg = "Tudo feito neste dia.";
    else if (isToday) msg = left === 1 ? "Falta 1 tarefa para hoje." : "Faltam " + left + " tarefas para hoje.";
    else msg = left === 1 ? "Ficou 1 tarefa pendente." : "Ficaram " + left + " tarefas pendentes.";
    $("pmsg").textContent = msg;
    $("goToday").hidden = isToday;

    var n = ready ? streak() : 0;
    $("streak").textContent = !ready ? "" : n > 0 ? "Sequência: " + n + (n === 1 ? " dia" : " dias") : "Sem sequência ativa";

    renderDays(ready);
    renderList(ready);

    var eb = $("editBtn");
    eb.textContent = state.editing ? "Concluir" : "Editar";
    eb.setAttribute("aria-pressed", state.editing ? "true" : "false");
    document.body.classList.toggle("editing", state.editing);

    if (fid) {
      var all = document.querySelectorAll("[data-focus]");
      for (var i = 0; i < all.length; i++) {
        if (all[i].getAttribute("data-focus") === fid) { all[i].focus({ preventScroll: true }); break; }
      }
    }
  }

  /* ---------- Actions ---------- */

  function toggle(id) {
    var cur = (state.days[selected] || []).slice();
    var i = cur.indexOf(id);
    if (i >= 0) cur.splice(i, 1); else cur.push(id);
    state.days[selected] = cur;
    render();
    if (backend) backend.saveDay(selected);
  }
  function addTask(title, cat) {
    var order = 0;
    state.tasks.forEach(function (t) { if (t.order > order) order = t.order; });
    backend.addTask({ title: title, cat: cat, order: order + 1 });
  }
  function handleRemove(id) {
    clearTimeout(pendingTimer);
    if (pendingRemove === id) {
      pendingRemove = null;
      backend.removeTask(id);
      render();
    } else {
      pendingRemove = id;
      pendingTimer = setTimeout(function () { pendingRemove = null; render(); }, 3000);
      render();
    }
  }

  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var id = b.getAttribute("data-id");
    if (b.getAttribute("data-act") === "toggle") toggle(id);
    else handleRemove(id);
  });
  $("days").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-date]");
    if (!b) return;
    selected = b.getAttribute("data-date");
    render();
  });
  $("goToday").addEventListener("click", function () { selected = today; render(); });
  $("editBtn").addEventListener("click", function () {
    state.editing = !state.editing;
    pendingRemove = null;
    $("addForm").hidden = !state.editing;
    render();
    if (state.editing) $("newTitle").focus({ preventScroll: true });
  });
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = $("newTitle");
    var title = input.value.trim();
    if (!title || !backend) return;
    addTask(title, validCat($("newCat").value));
    input.value = "";
    input.focus({ preventScroll: true });
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    var n = ymd(new Date());
    if (n !== today) {
      if (selected === today) selected = n;
      today = n;
      render();
    }
  });

  /* ---------- Storage ---------- */

  function onErr() {
    state.error = true;
    render();
    toast("Não foi possível ler os dados salvos.");
  }

  function startDb(db) {
    var tasks = db.collection("tasks");
    backend = {
      saveDay: function (date) {
        var snap = (state.days[date] || []).slice();
        pendingDays[date] = snap;
        enqueue(function () {
          var val = pendingDays[date] || snap;
          return db.doc("days/" + date).set({ date: date, done: val }).then(function () {
            if (pendingDays[date] === val) delete pendingDays[date];
          }, function (err) {
            delete pendingDays[date];
            throw err;
          });
        });
      },
      addTask: function (t) {
        var ref = tasks.doc();
        enqueue(function () {
          return ref.set({ title: t.title, cat: t.cat, order: t.order, createdAt: Date.now() });
        });
      },
      removeTask: function (id) {
        enqueue(function () { return db.doc("tasks/" + id).delete(); });
      }
    };
    tasks.orderBy("order").onSnapshot(function (snap) {
      state.tasks = snap.docs.map(function (d) {
        var x = d.data() || {};
        return { id: d.id, title: String(x.title || ""), cat: validCat(x.cat), order: +x.order || 0 };
      });
      state.tasksReady = true;
      render();
    }, onErr);
    db.collection("days").orderBy("date", "desc").limit(60).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) {
        var x = d.data() || {};
        m[d.id] = Array.isArray(x.done) ? x.done.filter(function (v) { return typeof v === "string"; }) : [];
      });
      Object.keys(pendingDays).forEach(function (k) { m[k] = pendingDays[k]; });
      state.days = m;
      state.daysReady = true;
      render();
    }, onErr);
  }

  function readLocal() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && Array.isArray(o.tasks) && o.days && typeof o.days === "object") return o;
      }
    } catch (e) {}
    return {
      tasks: DEFAULTS.map(function (d, i) { return { id: "d" + (i + 1), title: d[0], cat: d[1], order: i + 1 }; }),
      days: {}
    };
  }

  function startLocal() {
    var data = readLocal();
    state.tasks = data.tasks;
    state.days = data.days;
    state.tasksReady = true;
    state.daysReady = true;
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify({ tasks: state.tasks, days: state.days })); } catch (e) {}
    }
    backend = {
      saveDay: function () { persist(); },
      addTask: function (t) {
        state.tasks.push({ id: "t" + Date.now().toString(36), title: t.title, cat: t.cat, order: t.order });
        persist();
        render();
      },
      removeTask: function (id) {
        state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
        persist();
        render();
      }
    };
    $("note").hidden = false;
    render();
  }

  render();
  var p = (window.claude && typeof window.claude.use === "function") ? window.claude.use("db") : Promise.resolve(null);
  p.catch(function () { return null; }).then(function (db) {
    if (db) startDb(db); else startLocal();
  });
})();
</script>
